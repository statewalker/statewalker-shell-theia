name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: statewalker/statewalker-ci/.github/workflows/ci.yml@main
    with:
      # Required root scripts (`build`, `typecheck`) run without --if-present, every package with
      # a tsconfig.json has a `typecheck`, and every test file (the Playwright specs too) is
      # compiled by `typecheck` or `typecheck:tests`.
      baseline: app
      # gitleaks on the files and on every commit of the pull request, before the install.
      secret-scan: true
      # A publish step anywhere but the `publish` job of this file fails. Nothing publishes yet:
      # every package is private.
      release-path: true

  # The lockfile-only pull request that .github/workflows/statewalker-update.yml opens: merged
  # once every other check on it passes, after checking it changes pnpm-lock.yaml alone
  # (statewalker/statewalker-ci's merge-lockfile.yml; statewalker-root docs/process/merging.md).
  lockfile:
    needs: ci
    # !cancelled(): also after a failed check job, so the pull request gets a comment saying why.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.head_ref == 'deps/statewalker-lockfile' }}
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    uses: statewalker/statewalker-ci/.github/workflows/merge-lockfile.yml@main
    secrets: inherit
